name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/azure-fob-reader-app-yffw1m]
  workflow_dispatch:

# Publishing by pushing a branch needs only contents:write. The Pages API
# route (configure-pages with enablement) needs a permission the workflow
# token is not granted, and fails with "Resource not accessible by
# integration".
permissions:
  contents: write

# Let a running deploy finish rather than cancelling it - a half-published
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The decoder is the part worth gating a deploy on.
      - run: npm test

      - run: npm run build

      - name: Publish dist/ to the gh-pages branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Without this, Jekyll drops files whose names start with underscore.
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          # A fresh orphan history each time keeps the deploy branch small.
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

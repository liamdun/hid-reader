name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/azure-fob-reader-app-yffw1m]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it - a half-published
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The decoder is the part worth gating a deploy on.
      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repo if it is not already enabled, so this
          # works without anyone visiting the settings page first.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
